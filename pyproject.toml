[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segment_tools"
version = "1.0.0"
authors = [  { name="roiro" },]
description = "Segmentation tools"
license = {text = "MIT License"}
requires-python = "==3.11.*"
dependencies = [
    "torch @ https://download.pytorch.org/whl/cu121/torch-2.1.0%2Bcu121-cp311-cp311-linux_x86_64.whl#sha256=aa984599c2c4ffbc57c48d0d965cbe832e610c967e8179d4ac0a582c733fe112",
    "torchvision @ https://download.pytorch.org/whl/cu121/torchvision-0.16.0%2Bcu121-cp311-cp311-linux_x86_64.whl#sha256=7a325270c7806571ceddbd27c8ece5c163cceb476f09dcca7eb5157073216b22",
    "ultralytics",
    "GroundingDINO @ https://github.com/Tada-Lab/segment_tools/releases/download/py311/groundingdino-0.1.0-cp311-cp311-linux_x86_64.whl",
    "clip @ https://github.com/Tada-Lab/segment_tools/releases/download/py311/clip-1.0-py3-none-any.whl",
    "segment_anything @ https://github.com/Tada-Lab/segment_tools/releases/download/py311/segment_anything-1.0-py3-none-any.whl",
    "transformers==4.47.0",
    "numpy == 1.26.4",
    "cityscapesscripts @ git+https://github.com/mcordts/cityscapesScripts.git@a7ac7b4062d1a80ed5e22d2ea2179c886801c77d",
    "einops == 0.4.1",
    "diffdist == 0.1",
    "mmcv == 1.6.2",
    "detectron2 @ https://github.com/Tada-Lab/segment_tools/releases/download/py311/detectron2-0.6-cp311-cp311-linux_x86_64.whl",
    "imutils == 0.5.4",
    "rich == 13.7.1",
    "natten @ https://shi-labs.com/natten/wheels/cu121/torch2.1.0/natten-0.15.1%2Btorch210cu121-cp311-cp311-linux_x86_64.whl",
    "lvis == 0.5.3",
    "boto3 == 1.34.140",
    "supervision==0.25.0",
    "depth_pro @ git+https://github.com/apple/ml-depth-pro.git@b2cd0d51daa95e49277a9f642f7fd736b7f9e91d",
    "Cython == 3.0.11",
    "onnxruntime-gpu == 1.19.2",
    "insightface == 0.7.3",
    "nvidia-cudnn-cu12 == 9.1.0.70",
    "SAM-2 @ https://github.com/Tada-Lab/segment_tools/releases/download/py311/SAM_2-1.0-py3-none-any.whl",
    "gradio_rangeslider == 0.0.8",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.1.post1/flash_attn-2.7.1.post1+cu12torch2.1cxx11abiFALSE-cp311-cp311-linux_x86_64.whl",
    "timm==1.0.12"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.hatch.metadata]
allow-direct-references = true
